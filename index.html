<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Biophysics & Complex Systems</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void:#07090f; --bg-dark:#0a0d16;
      --bg-glass:rgba(14,22,38,0.62); --bg-glass-hover:rgba(18,30,52,0.78);
      --accent-primary:#7eb8f7; --accent-green:#7ecba1;
      --accent-amber:#e6b96a; --accent-rose:#e07b8a; --accent-lavender:#a78bca;
      --text-primary:#d4e4f5; --text-secondary:#7a96b5; --text-muted:#38506a;
      --border:rgba(126,184,247,0.1); --border-bright:rgba(126,184,247,0.28);
      --glow-primary:0 0 24px rgba(126,184,247,0.15);
      --glow-green:0 0 18px rgba(126,203,161,0.15);
      --font-mono:'JetBrains Mono',monospace; --font-display:'Syne',sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg-void);color:var(--text-primary);font-family:var(--font-mono);overflow-x:hidden;cursor:crosshair;}
    ::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-track{background:var(--bg-dark);}
    ::-webkit-scrollbar-thumb{background:var(--accent-primary);border-radius:2px;}

    /* NAV */
    #nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;background:rgba(7,9,15,0.93);border-bottom:1px solid var(--border);backdrop-filter:blur(24px);}
    .nav-logo{font-size:0.67rem;font-weight:700;letter-spacing:0.18em;color:var(--accent-primary);text-transform:uppercase;}
    .nav-links{display:flex;gap:2rem;list-style:none;}
    .nav-links a{font-size:0.62rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-secondary);text-decoration:none;position:relative;transition:color 0.2s;}
    .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--accent-primary);transform:scaleX(0);transition:transform 0.2s;}
    .nav-links a:hover{color:var(--accent-primary);} .nav-links a:hover::after{transform:scaleX(1);}
    .nav-status{display:flex;align-items:center;gap:0.5rem;font-size:0.58rem;color:var(--text-muted);}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);box-shadow:var(--glow-green);animation:blink 2.4s infinite;}

    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.35}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

    /* HERO */
    #hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #hero-canvas{position:absolute;inset:0;width:100%;height:100%;}
    .hero-content{position:relative;z-index:10;text-align:center;pointer-events:none;}
    .hero-label{font-size:0.62rem;color:var(--accent-primary);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:1.4rem;opacity:0;animation:fadeUp 0.8s 0.3s forwards;}
    .hero-name{font-family:var(--font-display);font-weight:800;font-size:clamp(2.8rem,7vw,6.5rem);line-height:1;letter-spacing:-0.025em;color:var(--text-primary);margin-bottom:0.6rem;opacity:0;animation:fadeUp 0.8s 0.5s forwards;}
    .hero-name span{color:var(--accent-primary);}
    .hero-title{font-size:0.78rem;color:var(--text-secondary);letter-spacing:0.07em;margin-bottom:2.2rem;opacity:0;animation:fadeUp 0.8s 0.7s forwards;}
    .hero-eq-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;opacity:0;animation:fadeUp 0.8s 0.9s forwards;}
    .hero-eq{font-size:0.72rem;color:var(--accent-amber);background:rgba(230,185,106,0.07);border:1px solid rgba(230,185,106,0.18);padding:0.5rem 1rem;display:inline-block;position:relative;cursor:help;}
    .hero-eq .eq-tip{display:none;position:absolute;bottom:110%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(7,9,15,0.97);border:1px solid rgba(230,185,106,0.25);font-size:0.64rem;color:var(--accent-amber);padding:0.4rem 0.7rem;pointer-events:none;z-index:99;}
    .hero-eq:hover .eq-tip{display:block;}
    .hero-cta{display:flex;gap:1rem;justify-content:center;margin-top:2rem;opacity:0;animation:fadeUp 0.8s 1.1s forwards;pointer-events:all;}
    .btn-primary{background:var(--accent-primary);color:#07090f;border:none;padding:0.6rem 1.5rem;font-family:var(--font-mono);font-size:0.62rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all 0.2s;}
    .btn-primary:hover{background:var(--text-primary);box-shadow:var(--glow-primary);}
    .btn-ghost{background:transparent;color:var(--accent-primary);border:1px solid var(--border-bright);padding:0.6rem 1.5rem;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all 0.2s;}
    .btn-ghost:hover{background:rgba(126,184,247,0.07);}

    /* LAYOUT */
    section{padding:6.5rem 0;position:relative;}
    .container{max-width:1220px;margin:0 auto;padding:0 2.5rem;}
    .section-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:3.5rem;}
    .section-id{font-size:0.58rem;color:var(--accent-primary);letter-spacing:0.22em;text-transform:uppercase;opacity:0.55;white-space:nowrap;}
    .section-title{font-family:var(--font-display);font-size:clamp(1.7rem,3vw,2.5rem);font-weight:800;color:var(--text-primary);letter-spacing:-0.02em;}
    .section-line{flex:1;height:1px;background:linear-gradient(to right,var(--border-bright),transparent);}
    .glass{background:var(--bg-glass);border:1px solid var(--border);backdrop-filter:blur(20px);}
    .glass-hover{transition:background 0.3s,border-color 0.3s,box-shadow 0.3s;}
    .glass-hover:hover{background:var(--bg-glass-hover);border-color:var(--border-bright);box-shadow:var(--glow-primary);}

    /* ABOUT — bio wider, skills narrower */
    #about{background:var(--bg-dark);}
    .about-grid{display:grid;grid-template-columns:1.65fr 0.85fr;gap:2rem;align-items:start;}
    .about-card{padding:2rem;}
    .about-tag{font-size:0.84rem;color:var(--accent-primary);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;}
    .about-tag::before{content:'▸';color:var(--accent-green);}
    .about-bio{font-size:0.84rem;line-height:2;color:var(--text-secondary);margin-bottom:1.2rem;}
    .about-bio strong{color:var(--text-primary);font-weight:500;}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--border);margin-top:1.5rem;}
    .stat-cell{padding:0.9rem 0.75rem;background:rgba(126,184,247,0.025);text-align:center;transition:background 0.2s;}
    .stat-cell:hover{background:rgba(126,184,247,0.06);}
    .stat-num{font-family:var(--font-display);font-size:1.7rem;font-weight:800;color:var(--accent-primary);line-height:1;}
    .stat-label{font-size:0.54rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:0.2rem;}

    /* SKILLS — slightly smaller than about-bio */
    .skills-panel{padding:1.5rem;}
    .skill-group{margin-bottom:1.15rem;}
    .skill-group-title{font-size:0.62rem;color:var(--accent-amber);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.55rem;}
    .skill-tags{display:flex;flex-wrap:wrap;gap:0.35rem;}
    .skill-tag{font-size:0.62rem;padding:0.22rem 0.55rem;background:rgba(126,184,247,0.05);border:1px solid var(--border);color:var(--text-secondary);transition:all 0.2s;cursor:default;}
    .skill-tag:hover{background:rgba(126,184,247,0.1);border-color:var(--accent-primary);color:var(--accent-primary);}
    .contact-links{display:flex;flex-direction:column;margin-top:1.5rem;}
    .contact-link{font-size:0.84rem;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:0.65rem;padding:0.52rem 0;border-bottom:1px solid var(--border);transition:color 0.2s;}
    .contact-link:hover{color:var(--accent-primary);}
    .contact-icon{color:var(--accent-primary);}

    /* TIMELINE */
    #trajectory{background:var(--bg-void);}
    .tl-tabs{display:flex;gap:0;margin-bottom:2.5rem;border-bottom:1px solid var(--border);}
    .tl-tab{padding:0.7rem 1.5rem;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;background:none;border:none;font-family:var(--font-mono);border-bottom:2px solid transparent;transition:all 0.2s;}
    .tl-tab.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary);}
    .tl-tab:hover:not(.active){color:var(--text-secondary);}
    .timeline{position:relative;padding-left:2.5rem;}
    .timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--accent-primary),transparent);}
    .tl-item{position:relative;margin-bottom:2.2rem;opacity:0;animation:fadeIn 0.45s forwards;}
    .tl-item::before{content:'';position:absolute;left:-2.55rem;top:0.32rem;width:9px;height:9px;border:1px solid var(--accent-primary);background:var(--bg-void);transform:rotate(45deg);transition:background 0.2s;}
    .tl-item:hover::before{background:var(--accent-primary);}
    .tl-date{font-size:0.58rem;color:var(--accent-primary);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.25rem;}
    .tl-role{font-family:var(--font-display);font-size:0.97rem;font-weight:600;color:var(--text-primary);margin-bottom:0.18rem;}
    .tl-place{font-size:0.67rem;color:var(--text-secondary);margin-bottom:0.42rem;}
    .tl-desc{font-size:0.68rem;color:var(--text-muted);line-height:1.75;max-width:680px;}
    .tl-badge{display:inline-block;font-size:0.52rem;padding:0.17rem 0.5rem;background:rgba(126,203,161,0.08);border:1px solid rgba(126,203,161,0.22);color:var(--accent-green);letter-spacing:0.1em;text-transform:uppercase;margin-left:0.6rem;vertical-align:middle;}
    .tl-badge-amber{background:rgba(230,185,106,0.08);border-color:rgba(230,185,106,0.22);color:var(--accent-amber);}

    /* RESEARCH CARDS */
    #research{background:var(--bg-dark);}
    .research-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem;}
    .r-card{background:var(--bg-glass);border:1px solid var(--border);cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;}
    .r-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-primary);transform:scaleX(0);transition:transform 0.3s;}
    .r-card:hover::before,.r-card.expanded::before{transform:scaleX(1);}
    .r-card:hover{border-color:var(--border-bright);box-shadow:var(--glow-primary);}
    .r-card.expanded{grid-column:1/-1;cursor:default;}
    .card-head{padding:1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
    .card-tag{font-size:0.53rem;color:var(--accent-amber);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.45rem;}
    .card-title{font-family:var(--font-display);font-size:1rem;font-weight:600;color:var(--text-primary);line-height:1.3;margin-bottom:0.45rem;}
    .card-sub{font-size:0.63rem;color:var(--text-secondary);line-height:1.65;}
    .card-toggle{font-size:1.3rem;color:var(--accent-primary);flex-shrink:0;transition:transform 0.3s;margin-top:0.1rem;line-height:1;}
    .r-card.expanded .card-toggle{transform:rotate(45deg);}
    .card-pills{padding:0 1.5rem 1.25rem;display:flex;gap:0.35rem;flex-wrap:wrap;}
    .pill{font-size:0.52rem;padding:0.2rem 0.5rem;background:rgba(126,184,247,0.05);border:1px solid var(--border);color:var(--text-muted);letter-spacing:0.04em;}
    .card-body{display:none;padding:0 1.5rem 1.5rem;}
    .r-card.expanded .card-body{display:block;}
    .card-divider{height:1px;background:var(--border);margin-bottom:1.5rem;}
    .exp-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:1.5rem;}
    .exp-block{border:1px solid var(--border);padding:1.2rem;}
    .exp-label{font-size:0.58rem;color:var(--accent-primary);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.9rem;display:flex;gap:0.5rem;}
    .exp-label::before{content:'//';color:var(--text-muted);}
    .exp-text{font-size:0.7rem;color:var(--text-secondary);line-height:1.85;}
    .exp-text strong{color:var(--accent-amber);font-weight:500;}
    .eq-box{font-size:0.68rem;color:var(--accent-amber);font-style:italic;background:rgba(230,185,106,0.05);border:1px solid rgba(230,185,106,0.12);padding:0.45rem 0.7rem;margin-bottom:0.4rem;}
    .resource-links{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;}
    .r-link{font-size:0.58rem;padding:0.22rem 0.55rem;border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;transition:all 0.2s;}
    .r-link:hover{border-color:var(--accent-primary);color:var(--accent-primary);}

    /* SIM WIDGET */
    .sim-wrap{background:rgba(0,0,0,0.4);border:1px solid var(--border);padding:1.2rem;}
    .sim-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem;}
    .sim-title{font-size:0.58rem;color:var(--accent-primary);letter-spacing:0.2em;text-transform:uppercase;}
    .sim-badge{font-size:0.5rem;padding:0.18rem 0.5rem;background:rgba(126,184,247,0.08);border:1px solid rgba(126,184,247,0.22);color:var(--accent-primary);letter-spacing:0.1em;animation:blink 2.5s infinite;}
    .sim-canvas-box{width:100%;height:210px;background:var(--bg-void);border:1px solid rgba(126,184,247,0.07);position:relative;overflow:hidden;margin-bottom:0.9rem;}
    .sim-canvas-box canvas{display:block;width:100%;height:100%;}
    .sim-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;background:rgba(7,9,15,0.72);}
    .sim-overlay-icon{font-size:2rem;color:var(--accent-primary);opacity:0.22;}
    .sim-overlay-txt{font-size:0.62rem;color:var(--text-muted);}
    .sim-overlay-code{font-size:0.56rem;color:var(--accent-amber);opacity:0.5;}

    /* SLIDERS — vertical stacking, no overlap */
    .sim-controls{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.5rem;}
    .sim-controls-row{display:flex;align-items:center;gap:0;width:100%;}
    .sim-lbl{font-size:0.62rem;color:var(--text-secondary);white-space:nowrap;width:120px;flex-shrink:0;}
    .sim-slider{flex:1;appearance:none;-webkit-appearance:none;height:2px;background:var(--border);outline:none;margin:0 0.6rem;cursor:pointer;border:none;}
    .sim-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:11px;height:11px;background:var(--accent-primary);cursor:pointer;border-radius:0;border:none;}
    .sim-slider::-moz-range-thumb{width:11px;height:11px;background:var(--accent-primary);cursor:pointer;border-radius:0;border:none;}
    .sim-val{font-size:0.62rem;color:var(--accent-primary);width:44px;text-align:right;flex-shrink:0;}
    .sim-btn{background:rgba(126,184,247,0.07);border:1px solid var(--border-bright);color:var(--accent-primary);padding:0.38rem 0.9rem;font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s;align-self:flex-start;margin-top:0.3rem;}
    .sim-btn:hover{background:rgba(126,184,247,0.14);box-shadow:var(--glow-primary);}
    .sim-hint{margin-top:0.65rem;font-size:0.56rem;color:var(--text-muted);line-height:1.6;}
    .sim-hint-kw{color:var(--accent-amber);}

    /* VIDEO PLAYER */
    .video-wrap{background:rgba(0,0,0,0.4);border:1px solid var(--border);padding:1.2rem;}
    .video-wrap video{width:100%;display:block;background:#000;border:1px solid rgba(126,184,247,0.1);}
    .video-label{font-size:0.58rem;color:var(--accent-primary);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.9rem;}
    .video-upload-label{display:block;border:1px dashed var(--border-bright);padding:0.8rem;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:0.8rem;background:rgba(126,184,247,0.02);}
    .video-upload-label:hover{background:rgba(126,184,247,0.06);border-color:var(--accent-primary);}
    .video-upload-label input{display:none;}
    .video-upload-icon{font-size:1.1rem;color:var(--accent-primary);opacity:0.4;margin-bottom:0.25rem;}
    .video-upload-txt{font-size:0.6rem;color:var(--text-muted);}
    .video-upload-ok{font-size:0.62rem;color:var(--accent-amber);margin-top:0.25rem;}

    /* PUBLICATIONS */
    #publications{background:var(--bg-void);}
    .pub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}
    .pub-card{background:var(--bg-glass);border:1px solid var(--border);padding:1.3rem;transition:all 0.2s;}
    .pub-card:hover{border-color:var(--border-bright);box-shadow:var(--glow-primary);}
    .pub-type{font-size:0.53rem;color:var(--accent-rose);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.6rem;}
    .pub-title{font-size:0.78rem;color:var(--text-primary);font-weight:500;line-height:1.55;margin-bottom:0.45rem;}
    .pub-venue{font-size:0.63rem;color:var(--text-muted);margin-bottom:0.7rem;}
    .pub-abstract{font-size:0.65rem;color:var(--text-secondary);line-height:1.75;margin-bottom:0.75rem;border-left:2px solid var(--border);padding-left:0.75rem;}
    .pub-links{display:flex;gap:0.4rem;flex-wrap:wrap;}
    .pub-link{font-size:0.56rem;padding:0.22rem 0.55rem;border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;transition:all 0.2s;}
    .pub-link:hover{border-color:var(--accent-primary);color:var(--accent-primary);}

    .scanline{position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(to bottom,transparent,transparent 2px,rgba(0,0,0,0.018) 2px,rgba(0,0,0,0.018) 4px);}
    footer{padding:2rem 2.5rem;background:var(--bg-dark);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .footer-l{font-size:0.58rem;color:var(--text-muted);letter-spacing:0.08em;}
    .footer-r{font-size:0.58rem;color:var(--text-muted);text-align:right;}
    .footer-r span{color:var(--accent-primary);}
    @media(max-width:820px){.about-grid,.exp-grid{grid-template-columns:1fr}.nav-links,.nav-status{display:none}.hero-name{font-size:2.8rem}.stats-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="scanline"></div>
<nav id="nav">
  <div class="nav-logo">// FHN_BIOPHYSICS_LAB</div>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#trajectory">Trajectory</a></li>
    <li><a href="#research">Research</a></li>
    <li><a href="#publications">Publications</a></li>
  </ul>
  <div class="nav-status"><div class="status-dot"></div><span>SIMULATOR READY</span></div>
</nav>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── HERO: particle network ── */
function HeroCanvas() {
  const ref = useRef(null), mouse = useRef({x:-9999,y:-9999}), anim = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    const resize = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    const N = 58;
    const nodes = Array.from({length:N}, () => ({
      x:Math.random()*c.width, y:Math.random()*c.height,
      vx:(Math.random()-0.5)*0.32, vy:(Math.random()-0.5)*0.32,
      r:Math.random()*1.8+0.8, phase:Math.random()*Math.PI*2, freq:Math.random()*0.018+0.004
    }));
    const onMM = e => { const r=c.getBoundingClientRect(); mouse.current={x:e.clientX-r.left,y:e.clientY-r.top}; };
    c.addEventListener('mousemove', onMM);
    const draw = () => {
      ctx.fillStyle='rgba(7,9,15,0.22)'; ctx.fillRect(0,0,c.width,c.height);
      const m=mouse.current;
      nodes.forEach(n => {
        const dx=n.x-m.x, dy=n.y-m.y, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<110&&dist>0){const f=(110-dist)/110*0.7;n.vx+=(dx/dist)*f;n.vy+=(dy/dist)*f;}
        n.phase+=n.freq; n.x+=n.vx; n.y+=n.vy; n.vx*=0.982; n.vy*=0.982;
        if(n.x<0){n.x=0;n.vx*=-1;} if(n.x>c.width){n.x=c.width;n.vx*=-1;}
        if(n.y<0){n.y=0;n.vy*=-1;} if(n.y>c.height){n.y=c.height;n.vy*=-1;}
      });
      for(let i=0;i<N;i++) for(let j=i+1;j<N;j++) {
        const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<135){const s=Math.abs(Math.sin(a.phase-b.phase)),al=(1-d/135)*0.28*(0.3+0.7*s);
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
          ctx.strokeStyle=`rgba(126,184,247,${al})`;ctx.lineWidth=0.6;ctx.stroke();}
      }
      nodes.forEach(n=>{const g=(Math.sin(n.phase)+1)/2;
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(126,184,247,${0.28+0.65*g})`;ctx.fill();
        if(g>0.82){ctx.beginPath();ctx.arc(n.x,n.y,n.r*3.5,0,Math.PI*2);ctx.fillStyle='rgba(126,184,247,0.04)';ctx.fill();}
      });
      anim.current=requestAnimationFrame(draw);
    };
    draw();
    return ()=>{cancelAnimationFrame(anim.current);c.removeEventListener('mousemove',onMM);window.removeEventListener('resize',resize);};
  },[]);
  return React.createElement('canvas',{ref,id:'hero-canvas'});
}

/* ── PROJECT 1: FHN Single Cell — cardiac formulation
   dv/dt = c1·v·(1−v)·(v−a) − c2·w + I
   dw/dt = ε·(v − b·w)
   v ∈ [0,1] normalised membrane potential
   paramsRef pattern: sliders stay live while simulation runs ── */
function FHNSingleCell() {
  const ref = useRef(null), anim = useRef(null), running = useRef(false);
  // Initial conditions: resting state near (0, 0)
  const stateRef = useRef({vv:0.25, ww:0.0, vH:[], wH:[]});
  const [isRunning, setIsRunning] = useState(false);
  // c1=c2=1 fixed (scaling constants). Free params:
  // a ∈ (−1,1): threshold position. b > 0: recovery speed of w. ε ≪ 1: timescale separation. I: external current.
  const C1 = 1, C2 = 1;
  const [params, setParams] = useState({a:0.13, b:0.5, eps:0.01, I:0.0});
  const paramsRef = useRef(params);
  useEffect(() => { paramsRef.current = params; }, [params]);

  const stop = useCallback(() => {
    running.current = false;
    cancelAnimationFrame(anim.current);
    setIsRunning(false);
  }, []);

  const drawFrame = useCallback(() => {
    const canvas = ref.current; if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const {a, b, eps, I} = paramsRef.current;
    const st = stateRef.current;

    // RK4 — c1=c2=1 fixed
    const dt = 0.5;
    for(let s = 0; s < 4; s++){
      const fv = (v,w) => C1*v*(1-v)*(v-a) - C2*w + I;
      const fw = (v,w) => eps*(v - b*w);
      const k1v = fv(st.vv, st.ww),                     k1w = fw(st.vv, st.ww);
      const k2v = fv(st.vv+dt/2*k1v, st.ww+dt/2*k1w),  k2w = fw(st.vv+dt/2*k1v, st.ww+dt/2*k1w);
      const k3v = fv(st.vv+dt/2*k2v, st.ww+dt/2*k2w),  k3w = fw(st.vv+dt/2*k2v, st.ww+dt/2*k2w);
      const k4v = fv(st.vv+dt*k3v,   st.ww+dt*k3w),     k4w = fw(st.vv+dt*k3v,   st.ww+dt*k3w);
      st.vv += dt/6*(k1v+2*k2v+2*k3v+k4v);
      st.ww += dt/6*(k1w+2*k2w+2*k3w+k4w);
      st.vH.push(st.vv); st.wH.push(st.ww);
      if(st.vH.length > 600){ st.vH.shift(); st.wH.shift(); }
    }

    ctx.fillStyle='#07090f'; ctx.fillRect(0,0,W,H);
    // Grid
    ctx.strokeStyle='rgba(126,184,247,0.04)'; ctx.lineWidth=1;
    for(let g=0;g<5;g++){const y=(H/4)*g;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    const half = W/2;
    const PAD = 14;

    // ── LEFT: v(t) time trace ──
    // v ∈ [−0.1, 1.1] for display
    const vMin=-0.1, vMax=1.1;
    const mapVy = v => H - PAD - ((v - vMin)/(vMax - vMin))*(H - 2*PAD);
    ctx.beginPath();
    for(let i=0;i<st.vH.length;i++){
      const x = PAD + (i/st.vH.length)*(half - 2*PAD);
      const y = mapVy(st.vH[i]);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(126,184,247,0.88)'; ctx.lineWidth=1.5; ctx.stroke();

    // Baseline v=0
    ctx.beginPath(); ctx.setLineDash([3,4]);
    ctx.moveTo(PAD, mapVy(0)); ctx.lineTo(half-PAD, mapVy(0));
    ctx.strokeStyle='rgba(126,184,247,0.15)'; ctx.lineWidth=1; ctx.stroke();
    ctx.setLineDash([]);

    // ── RIGHT: phase plane (v horizontal, w vertical) ──
    // v ∈ [−0.15, 1.15]; w window wide enough for w-nullcline w=v/b (b~0.5 → w_max~1/0.5=2 → clip at 0.4)
    const ppL = half + PAD, ppR = W - PAD, ppT = PAD, ppB = H - PAD;
    const ppW = ppR - ppL, ppH2 = ppB - ppT;
    const wMin = -0.05, wMax = 0.4;
    const ppX = v => ppL + ((v - vMin)/(vMax - vMin))*ppW;
    const ppY = w => ppB - ((w - wMin)/(wMax - wMin))*ppH2;

    // Axes
    ctx.strokeStyle='rgba(126,184,247,0.1)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ppX(0),ppT); ctx.lineTo(ppX(0),ppB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ppL,ppY(0)); ctx.lineTo(ppR,ppY(0)); ctx.stroke();

    // v-nullcline: w = [v(1−v)(v−a) + I] / 1   (c1=c2=1)  →  w = v(1−v)(v−a) + I
    ctx.strokeStyle='rgba(230,185,106,0.65)'; ctx.lineWidth=1.4; ctx.setLineDash([4,4]);
    ctx.beginPath();
    let firstNC = true;
    for(let vi=vMin; vi<=vMax; vi+=0.005){
      const wn = C1*vi*(1-vi)*(vi-a) + I;   // c2=1 → divide by 1
      if(wn < wMin-0.05 || wn > wMax+0.05){ firstNC=true; continue; }
      firstNC ? ctx.moveTo(ppX(vi),ppY(wn)) : ctx.lineTo(ppX(vi),ppY(wn));
      firstNC=false;
    }
    ctx.stroke();

    // w-nullcline: w = v / b   (lavender)
    ctx.strokeStyle='rgba(167,139,202,0.65)'; ctx.lineWidth=1.4;
    ctx.beginPath(); firstNC=true;
    for(let vi=vMin; vi<=vMax; vi+=0.005){
      const wn = vi / b;
      if(wn < wMin-0.05 || wn > wMax+0.05){ firstNC=true; continue; }
      firstNC ? ctx.moveTo(ppX(vi),ppY(wn)) : ctx.lineTo(ppX(vi),ppY(wn));
      firstNC=false;
    }
    ctx.stroke(); ctx.setLineDash([]);

    // Trajectory (sage green)
    ctx.beginPath();
    for(let i=0;i<st.vH.length;i++){
      const x=ppX(st.vH[i]), y=ppY(st.wH[i]);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(126,203,161,0.65)'; ctx.lineWidth=1.2; ctx.stroke();

    // Current state dot
    ctx.beginPath(); ctx.arc(ppX(st.vv),ppY(st.ww),4,0,Math.PI*2);
    ctx.fillStyle='rgba(126,203,161,1)'; ctx.fill();

    // Labels
    ctx.font='500 9px JetBrains Mono';
    ctx.fillStyle='rgba(126,184,247,0.45)';  ctx.fillText('v(t)',         PAD, 13);
    ctx.fillStyle='rgba(126,203,161,0.45)';  ctx.fillText('PHASE PLANE',  ppL, 13);
    ctx.fillStyle='rgba(230,185,106,0.55)';  ctx.fillText('— v-nullcline',ppL, 26);
    ctx.fillStyle='rgba(167,139,202,0.55)';  ctx.fillText('— w-nullcline',ppL, 39);
    ctx.fillStyle='rgba(126,184,247,0.3)';
    ctx.fillText(`v=${st.vv.toFixed(3)}  w=${st.ww.toFixed(4)}`, PAD, H-4);
  }, []);

  const startLoop = useCallback(() => {
    const canvas = ref.current; if(!canvas) return;
    canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
    stateRef.current = {vv:0.25, ww:0.0, vH:[], wH:[]};
    running.current = true; setIsRunning(true);
    const loop = () => { if(!running.current) return; drawFrame(); anim.current=requestAnimationFrame(loop); };
    loop();
  }, [drawFrame]);

  useEffect(()=>()=>{running.current=false;cancelAnimationFrame(anim.current);},[]);

  const setP = (k, val) => {
    const next = {...paramsRef.current, [k]: val};
    paramsRef.current = next;
    setParams(next);
  };

  // c1=c2=1 fixed — only expose the 4 free parameters
  const sliders = [
    ['I — External current', 'I',   -0.5,  0.5,  0.01,  2],  // I: drives excitation
    ['a — Threshold  (−1,1)','a',   -0.9,  0.9,  0.01,  2],  // a ∈ (−1,1)
    ['b — Recovery speed',   'b',    0.1,  2.0,  0.05,  2],  // b > 0
    ['ε — Timescale  (≪1)',  'eps',  0.001,0.1,  0.001, 3],  // ε ≪ 1
  ];

  return (
    <div className="sim-wrap">
      <div className="sim-head">
        <div className="sim-title">// FHN SINGLE CELL — CARDIAC FORMULATION</div>
        <div className="sim-badge">{isRunning ? 'LIVE' : 'IDLE'}</div>
      </div>
      <div className="sim-canvas-box" style={{height:'230px'}}>
        <canvas ref={ref} style={{width:'100%',height:'100%'}}/>
        {!isRunning && (
          <div className="sim-overlay">
            <div className="sim-overlay-icon">♡</div>
            <div className="sim-overlay-txt">Cardiac FHN · phase portrait + nullclines</div>
            <div className="sim-overlay-code">dv/dt = v(1−v)(v−a) − w + I  |  (v₀,w₀) = (0.25, 0)</div>
          </div>
        )}
      </div>
      <div className="sim-controls">
        {sliders.map(([l,k,mn,mx,st,dp]) => (
          <div className="sim-controls-row" key={k}>
            <span className="sim-lbl">{l}</span>
            <input type="range" className="sim-slider" min={mn} max={mx} step={st}
              value={params[k]}
              onChange={e => setP(k, parseFloat(e.target.value))}
            />
            <span className="sim-val">{params[k].toFixed(dp)}</span>
          </div>
        ))}
        <button className="sim-btn" onClick={() => isRunning ? stop() : startLoop()}>
          {isRunning ? '■ STOP' : '▶ RUN'}
        </button>
      </div>
      <div className="sim-hint">
        <span className="sim-hint-kw">// c₁ = c₂ = 1 fixed.</span> v ∈ [0,1] normalised potential.
        Vary <b>I</b> past threshold <b>a</b> for AP firing. Keep <b>ε ≪ 1</b> for timescale separation.
        Nullclines update live · RK4 · dt = 0.5 ms.
      </div>
    </div>
  );
}
